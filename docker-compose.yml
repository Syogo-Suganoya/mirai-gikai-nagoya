# ローカル開発用の PostgreSQL(本番は Neon)。起動: npm run db:up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mirai_gikai
    ports:
      - "5439:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mirai_gikai"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
